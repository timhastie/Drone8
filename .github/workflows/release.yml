# Pelagos-8 release build.
#
# Pushing a tag v* (or running this workflow by hand) builds the Camomile fork
# (engine/patches/*.patch on top of Camomile v1.0.8-beta10) on macOS, Windows
# and Linux, packages each build with tools/package_release.sh and, for a tag,
# attaches the three zips to a GitHub Release named after the tag.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CAMOMILE_REPO: https://github.com/pierreguillot/Camomile.git
  CAMOMILE_TAG: v1.0.8-beta10

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            # macOS 14 images were retired from GitHub Actions on 2 Nov 2026.
            os: macos-15
            generator: Unix Makefiles
            # JUCE's juceaide bootstrap ignores the project's deployment target
            # and fails on the macOS 15+ SDKs ("CGWindowListCreateImage is
            # unavailable") unless this environment variable is set while
            # cmake runs.
            macosx_deployment_target: "10.13"
            # Friendlier zip name than the lipo output "x86_64-arm64".
            arch_label: universal
          - platform: windows
            # windows-latest moved to Windows Server 2025 with Visual Studio
            # 2026 (Nov 2026); the 2022 image still carries VS 2022.
            os: windows-2022
            generator: Visual Studio 17 2022
          - platform: linux
            os: ubuntu-22.04
            generator: Unix Makefiles
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx_deployment_target }}
      BUILD_DIR: engine/camomile/build
      VST3: engine/camomile/build/Camomile_artefacts/Release/VST3/Camomile.vst3

    steps:
      # Windows git defaults to CRLF checkouts; the .patch series and the bash
      # scripts must stay byte-exact. JUCE also has paths longer than 260 chars.
      - name: Git settings (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - uses: actions/checkout@v4

      - name: Release version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y pkg-config libasound2-dev libjack-jackd2-dev \
            libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev

      # Git Bash on the Windows runner ships unzip but not zip.
      - name: Install zip (Windows)
        if: runner.os == 'Windows'
        run: choco install zip --no-progress -y

      - name: Fetch Camomile ${{ env.CAMOMILE_TAG }} and apply the fork patches
        run: |
          git clone --depth 1 --branch "$CAMOMILE_TAG" \
            --recurse-submodules --shallow-submodules \
            "$CAMOMILE_REPO" engine/camomile
          cd engine/camomile
          git -c user.name=lira -c user.email=lira@local am ../patches/*.patch
          git log --oneline -20

      # Patch 0015 makes the fork's CMAKE_OSX_ARCHITECTURES default universal
      # (no FORCE), so the -D below is explicit rather than required.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S engine/camomile -B "$BUILD_DIR" -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -S engine/camomile -B "$BUILD_DIR" -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S engine/camomile -B "$BUILD_DIR" -G "${{ matrix.generator }}" -A x64 \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # Only the VST3 is shipped (not the Standalone, not CamomileFx).
      - name: Build Camomile VST3
        run: cmake --build "$BUILD_DIR" --config Release --target Camomile_VST3 --parallel 4

      - name: Check the built bundle
        run: |
          find "$VST3"
          case "${{ matrix.platform }}" in
            macos)
              lipo -archs "$VST3/Contents/MacOS/Camomile" | tee archs.txt
              grep -q arm64 archs.txt
              grep -q x86_64 archs.txt
              ;;
            windows) test -f "$VST3/Contents/x86_64-win/Camomile.vst3" ;;
            linux)   test -f "$VST3/Contents/x86_64-linux/Camomile.so" ;;
          esac

      - name: Package
        env:
          ARCH: ${{ matrix.arch_label }}
        run: bash tools/package_release.sh "${{ matrix.platform }}" "$VST3" dist

      - uses: actions/upload-artifact@v4
        with:
          name: Pelagos-8-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Pelagos-8-*
          path: dist
          merge-multiple: true

      - run: ls -l dist

      # A release created by hand (with a tested macOS zip) keeps its assets and
      # notes; this step only adds the zips that are not there yet.
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          fail_on_unmatched_files: true
          overwrite_files: false
